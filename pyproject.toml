[project]
name = "hproj"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "David Morrison", email = "dm236@st-andrews.ac.uk" }
]
requires-python = ">=3.12"
dependencies = [
    "click>=8.1.8",
    "cuml-cu12[dask]>=26.2.0",
    "dask[distributed]>=2026.1.0",
    "dask-cuda>=26.2.0",
    "matplotlib>=3.10.8",
    "numpy>=2.2.3",
    "pandas>=2.2.3",
    "pylatex>=1.4.2",
    "python-dotenv>=1.1.1",
    "pyyaml>=6.0.2",
    "scipy>=1.15.2",
    "scikit-dimension>=0.3.4",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
    "torch>=2.8.0",
    "tqdm>=4.67.3",
    "xgboost>=3.2.0",
]

[project.scripts]
hproj = "hproj.__main__:main"

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.format]
docstring-code-format = true

[dependency-groups]
dev = [
    "black>=26.3.0",
    "ruff>=0.15.5",
]
